<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Татсфера · стажировочная площадка 2026 — загрузка…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: "Unbounded", Georgia, "Times New Roman", serif;
    --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --main:     #0B3C49;
    --bg:       #CBD2D0;
    --text:     #6A8D92;
    --accent1:  #731963;
    --accent2:  #F0E100;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%; right: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(240, 225, 0, 0.18), transparent 60%);
    border-radius: 50%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%; left: -10%;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(115, 25, 99, 0.14), transparent 60%);
    border-radius: 50%;
    pointer-events: none;
  }

  .loader {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loader__logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--main);
    letter-spacing: -0.02em;
  }

  .loader__mark {
    width: 48px; height: 48px;
    background: var(--accent2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0B3C49;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 800;
    box-shadow: 0 8px 20px rgba(240, 225, 0, 0.35);
  }

  .loader__spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(106, 141, 146, 0.25);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader__text {
    font-size: 0.85rem;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div class="loader">
    <div class="loader__logo">
      <span class="loader__mark">ТС</span>
      <span>Татсфера</span>
    </div>
    <div class="loader__spinner"></div>
    <div class="loader__text">Загружаем…</div>
  </div>

  <script>
    // Роутер авторизацией не занимается — это делает login.html.
    // Он просто отправляет пользователя на страницу входа, а login.html
    // сам решит: показать форму или сразу открыть deck.html.
    (function () {
      setTimeout(function () {
        window.location.replace('login.html');
      }, 250);
    })();
  </script>
</body>
</html>
